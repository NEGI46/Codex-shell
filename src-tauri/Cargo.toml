[package]
name = "codex-shell"
version = "0.1.0"
description = "A local-first desktop shell for Codex"
authors = ["Codex Shell contributors"]
edition = "2021"

[lib]
name = "codex_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
